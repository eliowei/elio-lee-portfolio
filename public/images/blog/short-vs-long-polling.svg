<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-label="Short Polling and Long Polling sequence comparison between client and server" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker>
    <marker id="aGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker>
  </defs>
  <rect width="760" height="450" rx="14" fill="#f7f8fa" stroke="#d6d9de"/>

  <!-- Short Polling -->
  <text x="195" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">Short Polling</text>
  <rect x="45" y="50" width="70" height="26" rx="6" fill="#e5e7eb"/><text x="80" y="68" text-anchor="middle" font-size="13" fill="#1f2937">Client</text>
  <rect x="275" y="50" width="70" height="26" rx="6" fill="#e5e7eb"/><text x="310" y="68" text-anchor="middle" font-size="13" fill="#1f2937">Server</text>
  <line x1="80" y1="78" x2="80" y2="395" stroke="#9ca3af" stroke-dasharray="4 4"/>
  <line x1="310" y1="78" x2="310" y2="395" stroke="#9ca3af" stroke-dasharray="4 4"/>

  <line x1="80" y1="105" x2="308" y2="105" stroke="#2563eb" stroke-width="2" marker-end="url(#aBlue)"/>
  <text x="195" y="98" text-anchor="middle" font-size="12" fill="#2563eb">request</text>
  <line x1="310" y1="125" x2="82" y2="125" stroke="#6b7280" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aGray)"/>
  <text x="195" y="143" text-anchor="middle" font-size="12" fill="#6b7280">empty</text>

  <text x="195" y="188" text-anchor="middle" font-size="12" font-style="italic" fill="#4b5563">wait for the interval…</text>

  <line x1="80" y1="225" x2="308" y2="225" stroke="#2563eb" stroke-width="2" marker-end="url(#aBlue)"/>
  <text x="195" y="218" text-anchor="middle" font-size="12" fill="#2563eb">request</text>
  <line x1="310" y1="245" x2="82" y2="245" stroke="#6b7280" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aGray)"/>
  <text x="195" y="263" text-anchor="middle" font-size="12" fill="#6b7280">empty</text>

  <text x="195" y="308" text-anchor="middle" font-size="12" font-style="italic" fill="#4b5563">wait for the interval…</text>

  <line x1="80" y1="345" x2="308" y2="345" stroke="#2563eb" stroke-width="2" marker-end="url(#aBlue)"/>
  <text x="195" y="338" text-anchor="middle" font-size="12" fill="#2563eb">request</text>
  <line x1="310" y1="365" x2="82" y2="365" stroke="#15803d" stroke-width="2.5" marker-end="url(#aGreen)"/>
  <text x="195" y="383" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">new data</text>

  <!-- divider -->
  <line x1="380" y1="30" x2="380" y2="410" stroke="#d6d9de"/>

  <!-- Long Polling -->
  <text x="570" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">Long Polling</text>
  <rect x="435" y="50" width="70" height="26" rx="6" fill="#e5e7eb"/><text x="470" y="68" text-anchor="middle" font-size="13" fill="#1f2937">Client</text>
  <rect x="665" y="50" width="70" height="26" rx="6" fill="#e5e7eb"/><text x="700" y="68" text-anchor="middle" font-size="13" fill="#1f2937">Server</text>
  <line x1="470" y1="78" x2="470" y2="395" stroke="#9ca3af" stroke-dasharray="4 4"/>
  <line x1="700" y1="78" x2="700" y2="395" stroke="#9ca3af" stroke-dasharray="4 4"/>

  <rect x="694" y="105" width="12" height="125" rx="3" fill="#fdba74"/>
  <rect x="694" y="268" width="12" height="82" rx="3" fill="#fdba74"/>

  <line x1="470" y1="105" x2="692" y2="105" stroke="#2563eb" stroke-width="2" marker-end="url(#aBlue)"/>
  <text x="585" y="98" text-anchor="middle" font-size="12" fill="#2563eb">request</text>
  <text x="585" y="172" text-anchor="middle" font-size="12" font-style="italic" fill="#4b5563">server holds the request…</text>

  <line x1="694" y1="230" x2="472" y2="230" stroke="#15803d" stroke-width="2.5" marker-end="url(#aGreen)"/>
  <text x="585" y="223" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">new data</text>

  <line x1="470" y1="268" x2="692" y2="268" stroke="#2563eb" stroke-width="2" marker-end="url(#aBlue)"/>
  <text x="585" y="261" text-anchor="middle" font-size="12" fill="#2563eb">request again, right away</text>
  <text x="585" y="312" text-anchor="middle" font-size="12" font-style="italic" fill="#4b5563">holds again…</text>

  <line x1="694" y1="350" x2="472" y2="350" stroke="#6b7280" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aGray)"/>
  <text x="585" y="343" text-anchor="middle" font-size="12" fill="#6b7280">timeout, empty</text>
  <line x1="470" y1="370" x2="692" y2="370" stroke="#2563eb" stroke-width="2" marker-end="url(#aBlue)"/>
  <text x="585" y="388" text-anchor="middle" font-size="12" fill="#2563eb">request again</text>

  <!-- footers -->
  <text x="195" y="430" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">The client decides when to ask</text>
  <text x="570" y="430" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">The server decides when to answer</text>
</svg>
